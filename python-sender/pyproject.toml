[project]
name = "decimen-sender"
version = "0.1.0"
description = "Decimen optical transfer — the sender, in Python"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "segno>=1.6",       # QR with a pinnable mask and a lockable version
    "pygame-ce>=2.5",   # the window, and the hand-drawn controls in it
    # macOS takes the Cmd-Tab and Dock icon from the application rather than
    # the window, so the icon needs a second route. Its absence costs the Dock
    # icon and nothing else.
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",
]

[project.scripts]
decimen-send = "decimen.app:main"

[dependency-groups]
# Only the conformance test wants these: zxing-cpp decodes the codes it just
# generated, Pillow gets them into a shape it accepts. The sender itself needs
# neither.
dev = [
    "zxing-cpp>=2.2",
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decimen"]

[tool.uv]
# Pin the interpreter rather than taking whatever is on PATH. uv's own builds
# are the same everywhere; a system or Homebrew Python is not — the earlier
# tkinter panel died on exactly that, and reproducibility is worth the pin even
# now that no tkinter is involved.
python-preference = "only-managed"
