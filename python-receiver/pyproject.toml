[project]
name = "decimen-receiver"
version = "0.1.0"
description = "Decimen optical transfer — the receiver, in Python, straight off a screen region"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",   # window, region selector, controls
    "zxing-cpp>=2.2",   # QR decode
    "numpy>=1.26",      # capture buffer and RGB conversion
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",   # screen capture
    "pyobjc-framework-cocoa>=12.2.2 ; sys_platform == 'darwin'",    # dock icon
]

[project.scripts]
decimen-receive = "decimen.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decimen"]

[tool.uv]
python-preference = "only-managed"

[dependency-groups]
dev = [
    "segno>=1.6",
]
